<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Over &amp; Out</title>
  <link rel="stylesheet" href="style.css" id="css">
</head>
<body>
  <main class="radio">
    <h1>Over &amp; Out</h1>
    <p id="status" aria-live="polite">Ready</p>
    <p class="hint" id="help" aria-live="polite" hidden></p>
    <p class="hint" id="new-channel" hidden><a href="./">Start a new channel</a></p>
    <button id="tune" type="button" class="tune">Tap to tune in</button>
    <div id="share" class="share" hidden>
      <label for="link">Send this link to your contact</label>
      <div class="row">
        <input id="link" type="text" readonly>
        <button id="copy" type="button">Copy</button>
      </div>
    </div>
    <button id="ptt" type="button" class="ptt" aria-pressed="false" hidden>Hold to talk</button>
    <p class="hint" id="hint" hidden>Hold the button or the Space bar to talk.</p>
    <audio id="remote" autoplay></audio>
  </main>
  <p class="version" id="version"></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script type="module">
    // Pages caches files for 10 minutes; URLs stamped with the commit make each deploy load fresh
    const t = await fetch('version.txt', { cache: 'no-store' }).then((r) => r.text()).catch(() => '{{');
    const v = t.includes('{{') ? 'dev' : t.trim().slice(0, 7);
    document.getElementById('version').textContent = v === 'dev' ? 'dev' : `v ${v}`;
    document.getElementById('css').href = `style.css?v=${v}`;
    await import(`./app.js?v=${v}`);
  </script>
</body>
</html>
